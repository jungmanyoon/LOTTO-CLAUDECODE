name: 예측 대량 생성 (선택 구매용)

# [정식 예측 대량 생성 2026-07-04] 30분마다 '정식 예측 기능 그대로' 5세트를 생성해 repo에 누적.
# 용도: 사람들이 이 많은 예측 중에서 골라 실제 로또를 구매한다(아무 번호 아님). 극단성 풀 +
# 다양성 선택 + 주간 저장 ML 보조신호(data/ml_signal.json)를 재사용해 주간 정식과 동일하게 만든다.
# 커밋에 [skip ci] -> HF 재빌드/다른 워크플로우 트리거 안 함(폭증 방지). 화면 반영은 주간 작업(토)이
# 끝에 HF를 재빌드할 때 일괄. GitHub Actions public repo 무료 무제한.

on:
  schedule:
    # [2026-08-06 정직화] 표기는 '30분마다'였지만 실제로는 한 번도 그렇게 돈 적이 없다.
    # 실측(442런/32일): 하루 13.8회(요구 48회의 28.7%)만 실행되고 최소 간격이 47.9분,
    # 중앙값 92.6분이었다. GitHub는 schedule이 밀리면 대기 중인 예약을 드롭한다.
    # 요구량을 줄여도 실제 실행 횟수는 사실상 같으므로, 실현 가능한 값으로 정직하게 적는다.
    # (':00' 정각은 전 세계에서 가장 혼잡한 슬롯이라 피한다)
    - cron: '17 * * * *'   # 매시 :17 (실측 기준 이 정도가 실제로 소화되는 빈도)
  workflow_dispatch:

concurrency:
  group: bulk-predict
  cancel-in-progress: false   # 겹치면 대기(중복 실행 방지)

permissions:
  contents: write

jobs:
  bulk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python 3.11 (+ pip 캐시)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 경량 의존성 설치 (극단풀 예측=numpy 기반, TF/ML 불필요)
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pandas pyyaml requests beautifulsoup4 tqdm pytz psutil

      - name: 예측 5세트 생성
        env:
          TF_CPP_MIN_LOG_LEVEL: '3'
          LOTTO_MAX_WORKERS: '2'
        run: python src/scripts/bulk_predict_once.py

      - name: 누적 결과 커밋 ([skip ci] = HF 재빌드 안 유발)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/predictions/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "신규 조합 없음(전부 중복) - 커밋 스킵"
            exit 0
          fi
          git commit -m "bulk: 예측 누적 [skip ci]"
          # 다른 잡의 커밋과 경합 대비: 최신을 rebase로 얹고 push(실패 시 다음 주기 재시도)
          git pull --rebase --autostash 2>/dev/null || true
          git push || echo "push 실패(경합) - 다음 30분 주기에 재시도"
